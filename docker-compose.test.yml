# docker-compose.test.yml — Smoke test para SISEXP-UPLA
# Ejecutar: docker compose -f docker-compose.yml -f docker-compose.test.yml up --exit-code-from tester

version: "3.8"

services:
  tester:
    image: curlimages/curl:latest
    container_name: sisexp-tester
    depends_on:
      nginx:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '╔══════════════════════════════════════╗'
        echo '║  SISEXP-UPLA — SMOKE TEST SUITE    ║'
        echo '╚══════════════════════════════════════╝'
        echo ''
        echo '⏳ Esperando 15s para que todos los servicios se registren en Eureka...'
        sleep 15
        echo ''
        FAILS=0
        PASS=0

        test_endpoint() {
          NAME=$$1
          URL=$$2
          EXPECT=$$3
          METHOD=$${4:-GET}
          DATA=$${5:-}
          AUTH=$${6:-}
          CHECK_BODY=$${7:-0}

          case "$$URL" in
            http://*|https://*) FULL_URL="$$URL" ;;
            *) FULL_URL="http://nginx$$URL" ;;
          esac

          if [ "$$AUTH" = "1" ]; then
            TOKEN=$$(curl -s -X POST http://nginx/api/auth/login -H 'Content-Type: application/json' -d '{"email":"jefe@upla.edu.pe","password":"jefe123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
            RES=$$(curl -s -w "%{http_code}" -o /tmp/resp.json -X $$METHOD "$$FULL_URL" -H "Authorization: Bearer $$TOKEN" -H 'Content-Type: application/json' -d "$$DATA")
          else
            RES=$$(curl -s -w "%{http_code}" -o /tmp/resp.json -X $$METHOD "$$FULL_URL" -H 'Content-Type: application/json' -d "$$DATA")
          fi

          if [ "$$CHECK_BODY" = "1" ]; then
            BODY=$$(cat /tmp/resp.json 2>/dev/null)
            if echo "$$BODY" | grep -qE "$$EXPECT"; then
              echo "  PASS  $$NAME (body matches $$EXPECT)"
              PASS=$$((PASS + 1))
              return 0
            fi
          fi

          if echo "$$RES" | grep -qE "$$EXPECT"; then
            echo "  PASS  $$NAME ($$RES $$EXPECT)"
            PASS=$$((PASS + 1))
            return 0
          else
            echo "  FAIL  $$NAME (got $$RES, expected $$EXPECT)"
            FAILS=$$((FAILS + 1))
            return 1
          fi
        }

        echo '─── Status & Health ───'
        test_endpoint "Status API" "/api/status" "200" GET "" 0
        test_endpoint "Eureka Dashboard" "http://eureka-server:8761" "200" GET "" 0

        echo '─── Auth ───'
        test_endpoint "Login correcto" "/api/auth/login" "200" POST '{"email":"jefe@upla.edu.pe","password":"jefe123"}' 0
        test_endpoint "Login incorrecto" "/api/auth/login" "400|401|403" POST '{"email":"a@b.com","password":"x"}' 0

        echo '─── Usuarios (JWT) ───'
        test_endpoint "Listar usuarios" "/api/usuarios" "200" GET "" 1
        test_endpoint "Auth me" "/api/auth/me" "200" GET "" 1

        echo '─── Techos Presupuestales (JWT) ───'
        test_endpoint "Listar techos" "/api/techos-presupuestales" "200" GET "" 1

        echo '─── Actividades POI (JWT) ───'
        TOKEN=$$(curl -s -X POST http://nginx/api/auth/login -H 'Content-Type: application/json' -d '{"email":"jefe@upla.edu.pe","password":"jefe123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        TECHO_ID=$$(curl -s http://nginx/api/techos-presupuestales -H "Authorization: Bearer $$TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        test_endpoint "Actividades por techo" "/api/actividades-poi/techo/$$TECHO_ID" "200" GET "" 1

        echo '─── Necesidades PAP (JWT) ───'
        ACT_ID=$$(curl -s "http://nginx/api/actividades-poi/techo/$$TECHO_ID" -H "Authorization: Bearer $$TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        test_endpoint "Necesidades por actividad" "/api/necesidades-pap/actividad/$$ACT_ID" "200" GET "" 1

        echo '─── Expedientes (JWT) ───'
        test_endpoint "Listar expedientes" "/api/expedientes" "200" GET "" 1

        echo '─── Notas Modificatorias (JWT) ───'
        test_endpoint "Listar notas" "/api/notas-modificatorias" "200" GET "" 1

        echo '─── Dashboard (JWT) ───'
        test_endpoint "Alertas" "/api/dashboard/alertas" "200" GET "" 1
        test_endpoint "Saldos" "/api/dashboard/saldos" "200" GET "" 1

        echo '─── Reportes (JWT) ───'
        test_endpoint "Reportes POI 2026" "/api/reportes/poi?anio=2026" "200" GET "" 1
        test_endpoint "Reportes PAP 2026" "/api/reportes/pap?anio=2026" "200" GET "" 1
        test_endpoint "Reportes Anual 2026" "/api/reportes/anual/2026" "200" GET "" 1
        test_endpoint "Reportes Expedientes 2026" "/api/reportes/expedientes?anio=2026" "200" GET "" 1

        echo '─── Notificaciones (JWT) ───'
        TOKEN=$$(curl -s -X POST http://nginx/api/auth/login -H 'Content-Type: application/json' -d '{"email":"jefe@upla.edu.pe","password":"jefe123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
        USER_ID=$$(curl -s http://nginx/api/auth/me -H "Authorization: Bearer $$TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        test_endpoint "Notificaciones usuario" "/api/notificaciones?usuarioId=$$USER_ID" "200" GET "" 1
        test_endpoint "Count notificaciones" "/api/notificaciones/count?usuarioId=$$USER_ID" "200" GET "" 1

        echo '─── Expediente rastreo (public) ───'
        test_endpoint "Rastreo publico" "/api/expedientes/rastreo/EXP-2026-001" "200" GET "" 0

        echo ''
        echo '══════════════════════════════════════════'
        echo "  TOTAL: $$((PASS + FAILS)) | PASS: $$PASS | FAIL: $$FAILS"
        echo '══════════════════════════════════════════'

        if [ "$$FAILS" -gt 0 ]; then
          echo 'SMOKE TESTS FAILED'
          exit 1
        fi
        echo 'ALL SMOKE TESTS PASSED'
        exit 0
    networks:
      - sisexp-net

networks:
  sisexp-net:
    external: true
